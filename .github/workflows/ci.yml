---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Pin sibling path-dep so Cargo.lock --locked stays valid in CI.
# Bump this when regenerating the lockfile against a newer rsReticulum.
env:
  RSRETICULUM_REF: d6d59dc6b506f13d8a0707e887716f847c7ac07f

jobs:
  test:
    name: Test (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: rsNomad
      - uses: actions/checkout@v5
        with:
          repository: ratspeak/rsReticulum
          ref: ${{ env.RSRETICULUM_REF }}
          path: rsReticulum
      # stable
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      # v2
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: rsNomad -> target
      - name: Install system deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config
      - run: cargo test --workspace --locked
        working-directory: rsNomad

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          path: rsNomad
      - uses: actions/checkout@v5
        with:
          repository: ratspeak/rsReticulum
          ref: ${{ env.RSRETICULUM_REF }}
          path: rsReticulum
      # stable
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: clippy, rustfmt
      # v2
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: rsNomad -> target
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config
      # Scope to workspace packages only — path deps (rsReticulum) are not ours to format.
      - run: cargo fmt -p nomad-core -- --check
        working-directory: rsNomad
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
        working-directory: rsNomad

  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          path: rsNomad
      - uses: actions/checkout@v5
        with:
          repository: ratspeak/rsReticulum
          ref: ${{ env.RSRETICULUM_REF }}
          path: rsReticulum
      # stable
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: rsNomad -> target
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - run: cargo audit
        working-directory: rsNomad
